<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>風コイン選択</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:monospace}#top{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(0,0,0,0.8);padding:1rem}#selected{font-size:18px;color:#f5c842;margin-top:.5rem}canvas{width:100vw;height:100vh;display:block}</style></head><body><div id="top"><div style="font-size:12px;opacity:.5">クリックしてコインを選択</div><div id="selected">選択中: なし</div></div><canvas id="c"></canvas><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.01,100);camera.position.set(0,0,15);scene.add(new THREE.AmbientLight(0xffffff,0.8));const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(5,5,5);scene.add(dl);const NAMES=['風1700.001','風1700.002','風1700.003','風1700.004','風1700.011','風1700.012','風1700.024','風1700.036','風1700.041'];const coins=[];new GLTFLoader().load('撮影スタジオ.glb',gltf=>{let i=0;gltf.scene.traverse(c=>{if(!c.isMesh||!NAMES.includes(c.name))return;const m=c.clone();m.rotation.x=Math.PI;m.scale.setScalar(0.4);m.position.set((i%3-1)*3.5,-(Math.floor(i/3)-1)*3.5,0);scene.add(m);coins.push({mesh:m,name:c.name});i++;});});window.addEventListener('click',e=>{const r=new THREE.Raycaster(),mouse=new THREE.Vector2((e.clientX/window.innerWidth)*2-1,-(e.clientY/window.innerHeight)*2+1);r.setFromCamera(mouse,camera);const hits=r.intersectObjects(coins.map(c=>c.mesh),true);if(hits.length){let obj=hits[0].object;while(obj){const f=coins.find(c=>c.mesh===obj);if(f){document.getElementById('selected').textContent='選択中: '+f.name;break;}obj=obj.parent;}}});(function animate(){requestAnimationFrame(animate);const t=Date.now()/1000;coins.forEach((c,i)=>{c.mesh.rotation.y=Math.PI+Math.sin(t*.5+i)*.2;});renderer.render(scene,camera);})();</script></body></html>
