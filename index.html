<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinra Pocket</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;color:#F5F2EB;font-family:"Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{text-align:center;padding:40px 20px;}
.logo{font-family:"Bebas Neue",cursive;font-size:28px;letter-spacing:0.15em;color:#FFD600;margin-bottom:40px;}
h1{font-family:"Bebas Neue",cursive;font-size:clamp(48px,10vw,96px);line-height:0.95;letter-spacing:0.03em;margin-bottom:20px;}
.accent{color:#FFD600;}
p{font-size:14px;color:rgba(245,242,235,0.5);margin-bottom:40px;line-height:1.8;}
a{display:inline-block;background:#FFD600;color:#080808;font-size:12px;font-weight:700;letter-spacing:0.1em;padding:14px 32px;text-decoration:none;text-transform:uppercase;}
a:hover{opacity:0.88;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="logo">SHINRA POCKET</div>
  <h1>同じ場所、<br><span class="accent">違う世界。</span></h1>
  <p>ただいま準備中です。<br>ボードゲームはこちらから遊べます。</p>
  <a href="/game">しんらポケットを遊ぶ →</a>
</div>
</body>
</html>
