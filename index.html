<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinra Pocket</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;color:#F5F2EB;font-family:"Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{text-align:center;padding:40px 20px;max-width:600px;}
.logo{font-family:"Bebas Neue",cursive;font-size:24px;letter-spacing:0.2em;color:#FFD600;margin-bottom:48px;}
h1{font-family:"Bebas Neue",cursive;font-size:clamp(52px,12vw,108px);line-height:0.95;letter-spacing:0.03em;margin-bottom:28px;display:inline-block;}
.line1{display:block;color:#F5F2EB;}
.line2{display:block;color:#FFD600;}
p{font-size:13px;color:rgba(245,242,235,0.45);margin-bottom:44px;line-height:1.8;letter-spacing:0.05em;}
a{display:inline-block;background:#FFD600;color:#080808;font-family:"Noto Sans JP",sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:16px 40px;text-decoration:none;}
a:hover{opacity:0.88;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="logo">SHINRA POCKET</div>
  <h1>
    <span class="line1">同じ場所、</span>
    <span class="line2">違う世界。</span>
  </h1>
  <p>ただいま準備中です。<br>ボードゲームについてはこちらから。</p>
  <a href="/game">しんらポケットを見る →</a>
</div>
</body>
</html>
