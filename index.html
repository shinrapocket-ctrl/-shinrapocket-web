<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinra Pocket</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;color:#F5F2EB;font-family:"Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{text-align:center;max-width:720px;width:100%;padding:40px 20px;}
.logo{font-family:"Bebas Neue",cursive;font-size:13px;letter-spacing:0.22em;color:#FFD600;margin-bottom:36px;}
.title-block{display:inline-block;text-align:left;margin-left:4em;}@media(max-width:600px){.title-block{margin-left:2.2em;}}@media(max-width:600px){.title-block{margin-left:2.2em;}}
h1{font-family:"Bebas Neue",cursive;font-size:clamp(64px,8vw,96px);line-height:0.92;letter-spacing:0.02em;margin-bottom:32px;font-weight:900;white-space:nowrap;}
.line1{display:block;color:#F5F2EB;}
.line2{display:block;color:#FFD600;}
p{font-size:13px;color:rgba(245,242,235,0.45);margin-bottom:40px;line-height:1.8;letter-spacing:0.05em;}
a{display:inline-block;background:#FFD600;color:#080808;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:16px 40px;text-decoration:none;}
a:hover{opacity:0.88;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="logo">SHINRA POCKET</div>
  <div class="title-block">
    <h1>
      <span class="line1">同じ場所、</span>
      <span class="line2">違う世界。</span>
    </h1>
  </div>
  <p>ただいま準備中です。</p>
  <a href="/game">しんらポケットを見る →</a>
</div>
</body>
</html>
